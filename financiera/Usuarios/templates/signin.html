{% load static %}
<!DOCTYPE html>
<html lang="es">
  <head>
     <!-- Favicon principal (32x32) -->
    <link rel="icon" href="{% static 'img/favicon-32x32.png' %}" sizes="32x32" type="image/png">
    
    <!-- Favicon secundario (16x16) -->
    <link rel="icon" href="{% static 'img/favicon-16x16.png' %}" sizes="16x16" type="image/png">

    <!-- Favicon para dispositivos Apple -->
    <link rel="apple-touch-icon" href="{% static 'img/apple-touch-icon.png' %}">
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iniciar Sesión</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="/static/css/login.css" />
  </head>
  <body>
    <div class="d-flex justify-content-center align-items-center vh-100">
      <div class="bg-white p-5 rounded-5 text-secondary shadow-lg" style="width: 25rem; max-width: 100%; min-width: 20rem;">
        <div class="d-flex justify-content-center">
          <img src="/static/img/login-icon.svg" alt="login-icon" style="height: 7rem" />
        </div>
        <div class="text-center fs-1 fw-bold mb-4">Iniciar Sesión</div>

        <!-- Mostrar errores si existen -->
        {% if error %}
          <div class="alert alert-danger">{{ error }}</div>
        {% endif %}

        <form action="{% url 'login' %}" method="POST">
          {% csrf_token %}
          
          <!-- Campo de nombre de usuario con ícono -->
          <div class="input-group mt-4">
            <div class="input-group-text login">
              <img src="/static/img/username-icon.svg" alt="username-icon" style="height: 1rem" />
            </div>
            <input
              class="form-control bg-light"
              type="text"
              name="username"
              id="username"
              placeholder="Escribe tu usuario"
              required
            />
          </div>
          
          <!-- Campo de contraseña con ícono -->
          <div class="input-group mt-1">
            <div class="input-group-text login">
              <img src="/static/img/password-icon.svg" alt="password-icon" style="height: 1rem" />
            </div>
            <input
              class="form-control bg-light"
              type="password"
              name="password"
              id="password"
              placeholder="Escribe tu contraseña"
              required
            />
          </div>
          
          <!-- Botón de envío -->
          <button class="btn btn-primary text-white w-100 mt-4 fw-semibold shadow-sm">Iniciar Sesión</button>
        </form>
      </div>
    </div>
  </body>
</html>
