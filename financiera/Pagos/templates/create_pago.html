{% extends 'base.html' %}
{% block content %}

<link href="/static/css/signup.css" rel="stylesheet">
<div class="d-flex justify-content-center align-items-center vh-100">
    <div class="bg-white p-4 rounded-5 text-secondary shadow-lg" style="width: 100%; max-width: 500px;">
  
        <div class="text-center fs-1 fw-bold mb-4">Crear Nuevo Pago</div>
  
        <!-- Mostrar errores si existen -->
        {% if error %}
            <div class="alert alert-danger">{{ error }}</div>
        {% endif %}
  
        <!-- Formulario de pago -->
        <form method="post" class="card-body">
            {% csrf_token %}
            
            <!-- Campo Préstamo -->
            <div class="mb-3">
                <label for="prestamo_id" class="form-label">Préstamo:</label>
                <select name="prestamo_id" id="prestamo_id" class="form-control" required>
                    <option value="">Seleccione un préstamo</option>
                    {% for prestamo in prestamos %}
                    <option value="{{ prestamo.id }}">Préstamo #{{ prestamo.id }}</option>
                    {% endfor %}
                </select>
            </div>
            
            <!-- Campo Monto -->
            <div class="mb-3">
                <label for="monto_pago" class="form-label">Monto:</label>
                <input type="number" name="monto_pago" id="monto_pago" class="form-control" 
                       step="0.01" min="0" placeholder="Ingrese el monto del pago" required>
            </div>
            
            <!-- Campo Fecha -->
            <div class="mb-3">
                <label for="fecha_pago" class="form-label">Fecha:</label>
                <input type="datetime-local" name="fecha_pago" id="fecha_pago" class="form-control" required>
            </div>
            
            <!-- Campo Método de Pago -->
            <div class="mb-3">
                <label for="metodo_pago" class="form-label">Método de pago:</label>
                <select name="metodo_pago" id="metodo_pago" class="form-control" required>
                    <option value="" disabled selected>Seleccione un método</option>
                    <option value="EFECTIVO">Efectivo</option>
                    <option value="TARJETA">Tarjeta de crédito/débito</option>
                    <option value="TRANSFERENCIA">Transferencia bancaria</option>
                    <option value="CHEQUE">Cheque</option>
                    <option value="OTRO">Otro método</option>
                </select>
            </div>
            
            <!-- Botones de acción -->
            <div class="d-flex gap-2">
                <a href="{% url 'pagos' %}" class="btn btn-secondary text-white w-100 mt-3 fw-semibold shadow-sm">
                    Cancelar
                </a>
                <button type="submit" class="btn btn-primary text-white w-100 mt-3 fw-semibold shadow-sm">
                    Guardar Pago
                </button>
            </div>
        </form>
    </div>
</div>

{% endblock %}
