{% extends 'base.html' %}
{% block title %}Editar documento{% endblock %}
{% block content %}
<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
      <div class="card shadow-sm border-0">
        <div class="card-header bg-warning text-dark">
          <h4><i class="fas fa-edit me-2"></i>Editar documento</h4>
        </div>
        <div class="card-body">
          <p><strong>Archivo actual:</strong> <a href="{{ documento.archivo.url }}" target="_blank">{{ documento.nombre }}</a></p>
          <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="mb-3">
              <label for="nombre" class="form-label">Nombre</label>
              <input type="text" name="nombre" id="nombre" class="form-control" value="{{ documento.nombre }}" required>
            </div>
            <div class="mb-3">
              <label for="archivo" class="form-label">Reemplazar archivo (opcional)</label>
              <input type="file" name="archivo" id="archivo" class="form-control" accept=".pdf,.doc,.docx,.jpg,.png">
            </div>
            <button type="submit" class="btn btn-warning w-100">Actualizar</button>
          </form>
        </div>
        <div class="card-footer text-center">
          <a href="{% url 'documentos' %}" class="btn btn-link">Volver</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
