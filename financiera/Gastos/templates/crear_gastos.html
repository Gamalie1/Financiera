{% extends 'base.html' %}
<title>{% block title %}Registrar gasto{% endblock %}</title>
{% block content %}
<link href="/static/css/signup.css" rel="stylesheet">
<div class="d-flex justify-content-center align-items-center vh-100">
    <div class="bg-white p-4 rounded-5 text-secondary shadow-lg" style="width: 100%; max-width: 500px;">
  
        <div class="text-center fs-1 fw-bold mb-4">Crear Nuevo Gasto</div>
  
        <!-- Mostrar errores si existen -->
        {% if error %}
            <div class="alert alert-danger">{{ error }}</div>
        {% endif %}
  
        <!-- Formulario de gasto -->
        <form method="post" class="card-body">
            {% csrf_token %}
            
          
            
            <!-- Campo Monto -->
            <div class="mb-3">
                <label for="monto" class="form-label">Monto:</label>
                <input type="number" name="monto" id="monto" class="form-control" 
                       step="0.01" min="0" placeholder="Ingrese el monto del gasto" required>
            </div>
            
            <!-- Campo Fecha de Registro -->
            <div class="mb-3">
                <label for="fecha_registro" class="form-label">Fecha de Registro:</label>
                <input type="datetime-local" name="fecha_registro" id="fecha_registro" class="form-control" required>
            </div>
            
            <!-- Campo Concepto -->
            <div class="mb-3">
                <label for="concepto" class="form-label">Concepto:</label>
                <textarea name="concepto" id="concepto" class="form-control" placeholder="Descripción del gasto" required></textarea>
            </div>
            
            <!-- Botones de acción -->
            <div class="d-flex gap-2">
                <a href="{% url 'Gastos' %}" class="btn btn-secondary text-white w-100 mt-3 fw-semibold shadow-sm">
                    Cancelar
                </a>
                <button type="submit" class="btn btn-primary text-white w-100 mt-3 fw-semibold shadow-sm">
                    Guardar Gasto
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
