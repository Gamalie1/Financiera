{% extends 'base.html' %}
<title>{% block title %}Generar prestamo{% endblock %}</title>
{% block content %}
<div class="container py-4">
    <div class="card shadow">
        <div class="card-header bg-primary text-white">
            <div class="d-flex justify-content-between align-items-center">
                <h2 class="mb-0">
                    <i class="fas fa-edit me-2"></i>Editar Préstamo Grupal
                </h2>
            </div>
        </div>

        <div class="card-body">
            {% if messages %}
                {% for message in messages %}
                <div class="alert alert-{{ message.tags }} alert-dismissible fade show mb-4">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                {% endfor %}
            {% endif %}

            <form method="post" class="needs-validation">
                {% csrf_token %}
                <input type="hidden" name="integrantes" id="integrantes-input">

               <!-- Datos Administrativos -->
<div class="border-bottom mb-4 pb-3">
    <h5 class="fw-bold text-secondary">
        <i class="fas fa-file-alt me-2"></i>Datos Administrativos
    </h5>

    <div class="row g-4 mt-1">
        <!-- Nombre del Grupo -->
        <div class="col-md-6">
            <label for="id_nombre" class="form-label fw-bold">Nombre del Grupo*</label>
            <input type="text" class="form-control form-control-lg" id="id_nombre" name="nombre"
                   value="{{ grupo.nombre }}" required>
        </div>

        <!-- Descripción del Grupo -->
        <div class="col-md-6">
            <label for="id_descripcion" class="form-label fw-bold">Descripción</label>
            <textarea class="form-control form-control-lg" id="id_descripcion" name="descripcion" rows="2">{{grupo.descripcion }}</textarea>
        </div>
    </div>

 <div class="row g-4 mt-3">
    <div class="col-md-6">
        <label for="id_responsable" class="form-label fw-bold">
            Responsable del Grupo*
        </label>

        <select name="responsable" id="id_responsable"
                class="form-select form-select-lg py-3 bg-white" required>

            <option value="">Seleccione un responsable</option>

            {% for cliente in clientes %}
                <option value="{{ cliente.id }}"
                    {% if cliente.id == grupo.responsable_id %}
                        selected
                    {% endif %}
                >
                    {{ cliente.nombre }} - {{ cliente.dni }}
                </option>
            {% endfor %}

        </select>
    </div>
</div>
</div>

              

                <!-- Integrantes -->
              

                <!-- Botones -->
                <div class="d-flex justify-content-between mt-4">
                    <a href="{% url 'principalPrestamos' %}" class="btn btn-lg btn-outline-secondary">
                        <i class="fas fa-arrow-left me-2"></i>Cancelar
                    </a>
                    <button type="submit" class="btn btn-lg btn-primary">
                        <i class="fas fa-paper-plane me-2"></i>Actualizar Préstamo
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>


{% endblock %}
